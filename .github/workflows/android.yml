name: Android APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK to build
        type: choice
        required: true
        default: debug
        options:
          - debug
          - unsigned-release

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android and Rust targets
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android x86_64-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake clang
      - name: Build both Android architectures
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          if [ "$VARIANT" = unsigned-release ]; then
            bash android/gradlew -p android :app:assembleLiveRelease
          else
            bash android/gradlew -p android :app:assembleLiveDebug
          fi
      - name: Check the packaged libraries
        run: |
          apk=$(find android/app/build/outputs/apk/live -name '*.apk' -print -quit)
          python3 android/verify-apk.py "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-android-${{ inputs.variant }}
          path: android/app/build/outputs/apk/live/**/*.apk
          if-no-files-found: error
          retention-days: 7
