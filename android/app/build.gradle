plugins { id 'com.android.application' version '8.10.1' }

def selectedAbis = providers.gradleProperty('abis').getOrElse('arm64-v8a,x86_64').split(',') as List
if (!selectedAbis.every { it in ['arm64-v8a', 'x86_64'] }) throw new GradleException("Unsupported Android ABI: $selectedAbis")

android {
    namespace 'io.github.timeshallhalt.harmony.android'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.timeshallhalt.harmony.android'
        minSdk 28
        targetSdk 35
        ndk { abiFilters.addAll(selectedAbis) }
        versionCode 10202
        versionName '1.2.0'
    }
    flavorDimensions += 'service'
    productFlavors {
        live { dimension 'service' }
        fixture { dimension 'service'; applicationIdSuffix '.fixture' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
androidComponents.beforeVariants(androidComponents.selector().withFlavor(new kotlin.Pair('service','fixture')).withBuildType('release')) {
    it.enable = false
}

abstract class BuildRust extends DefaultTask {
    @Input abstract Property<String> getMode()
    @Input abstract Property<Boolean> getFixture()
    @Input abstract ListProperty<String> getAbis()
    @Input abstract Property<String> getPythonCommand()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @Inject abstract ExecOperations getExecOperations()

    @TaskAction void compile() {
        execOperations.exec {
            workingDir project.rootProject.projectDir.parentFile
            commandLine([pythonCommand.get(), 'android/build-native.py', '--variant', mode.get(),
                '--output', outputDirectory.get().asFile] + (fixture.get() ? ['--fixture'] : []) +
                abis.get().collectMany { ['--abi', it] })
        }
    }
}
def python = providers.gradleProperty('python').getOrElse(System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3')
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def nativeTask = tasks.register("build${variant.name.capitalize()}Rust", BuildRust) {
        mode.set(variant.buildType)
        fixture.set(variant.flavorName == 'fixture')
        abis.set(selectedAbis)
        pythonCommand.set(python)
        outputDirectory.set(layout.buildDirectory.dir("rust/${variant.name}"))
        // Cargo tracks the full Rust and Slint dependency graph.
        outputs.upToDateWhen { false }
    }
    variant.sources.jniLibs.addGeneratedSourceDirectory(nativeTask) { it.outputDirectory }
}
// Match the Android trust verifier and its revocation-list policy to the native crate.
def verifier = providers.fileContents(rootProject.layout.projectDirectory.file('../Cargo.lock')).asText.map { lock ->
    def entry = lock =~ /(?m)^name = "rustls-platform-verifier-android"\r?\nversion = "([^"]+)"/
    if (!entry.find()) throw new GradleException('Missing Android verifier in Cargo.lock')
    "org.rustls:rustls-platform-verifier:${entry.group(1)}"
}
dependencies {
    implementation verifier
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}
